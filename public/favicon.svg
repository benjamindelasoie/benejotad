<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    benejotad mark: a brutalist lowercase "b" with a square bowl (zero radius,
    hard corners — DESIGN.md), knocked out of a solid tile. Theme-aware: the
    tile inverts with prefers-color-scheme so it stays visible on light and dark
    browser chrome. Built from rects so it's crisp at any size.
  -->
  <style>
    .tile { fill: #0a0a0a; }
    .mark { fill: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #fafafa; }
      .mark { fill: #0a0a0a; }
    }
  </style>
  <rect class="tile" width="100" height="100" />
  <!-- stem -->
  <rect class="mark" x="26" y="14" width="15" height="72" />
  <!-- square bowl -->
  <rect class="mark" x="26" y="40" width="48" height="46" />
  <!-- counter (hole) -->
  <rect class="tile" x="47" y="51" width="16" height="24" />
</svg>
